server:
  port: 8080
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/ainlp;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
