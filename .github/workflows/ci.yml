name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: rag_test
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rag_test -d rag_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify imports
        run: python -c "import streamlit, authlib, qdrant_client, sentence_transformers, pypdf, pandas, openpyxl, groq, jwt, psycopg, yaml"
      - name: Compile application
        run: python -m compileall -q app.py src scripts
      - name: Run tests
        env:
          JWT_SECRET: ci-only-test-secret
          DATABASE_URL: postgresql://rag_test:rag_test@localhost:5432/rag_test
        run: pytest -q
      - name: Build Docker image
        run: docker build -t enterprise-rag-rbac:ci .
