services:
  - type: web
    name: enterprise-rag
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-rag-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_SECONDS
        value: "3600"
      - key: AUDIT_LOGGING
        value: "true"
      - key: OIDC_ENABLED
        value: "false"
      - key: OIDC_PROVIDER
        value: "google"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"

databases:
  - name: enterprise-rag-db
    databaseName: enterprise_rag
    user: enterprise_rag
    plan: free
